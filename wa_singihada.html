<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById('webcam');
const overlayImg = document.getElementById('overlay-img');

let fistDetected = false;

function isFist(landmarks) {
  const fingerTips = [8, 12, 16, 20];
  const fingerMCPs = [5, 9, 13, 17];
  const wrist = landmarks[0];
  let closedCount = 0;
  for (let i = 0; i < fingerTips.length; i++) {
    const tip = landmarks[fingerTips[i]];
    const mcp = landmarks[fingerMCPs[i]];
    const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
    const mcpDist = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y);
    if (tipDist < mcpDist * 0.9) closedCount++;
  }
  const thumbTip = landmarks[4];
  const thumbMCP = landmarks[2];
  const thumbDist = Math.hypot(thumbTip.x - wrist.x, thumbTip.y - wrist.y);
  const thumbMCPDist = Math.hypot(thumbMCP.x - wrist.x, thumbMCP.y - wrist.y);
  if (thumbDist < thumbMCPDist * 1.1) closedCount++;
  return closedCount >= 4;
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.5
});

hands.onResults((results) => {
  let anyFist = false;
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    for (const landmarks of results.multiHandLandmarks) {
      if (isFist(landmarks)) anyFist = true;
    }
  }
  if (anyFist !== fistDetected) {
    fistDetected = anyFist;
    if (fistDetected) {
      overlayImg.classList.add('show');
    } else {
      overlayImg.classList.remove('show');
    }
  }
});

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: 'user' }
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 1280,
        height: 720
      });
      camera.start();
    };
  } catch (err) {
    console.error(err);
  }
}

startCamera();
</script>
